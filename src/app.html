<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Designer Testing Hub - Test. Track. Report. Record Designer test projects, bugs, pros and cons and generate PDF reports in one click." />
		<meta name="theme-color" content="#FFD60A" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<title>Designer Testing Hub</title>
		<script>
			// Apply the saved theme before first paint (no flash of the wrong theme).
			try {
				var t = localStorage.getItem('dth.theme');
				if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		<style>
			#boot-loader { position: fixed; inset: 0; display: grid; place-items: center; background: #fff8e7; font: 700 20px system-ui, sans-serif; color: #111; z-index: 50; }
			html[data-theme='dark'] #boot-loader { background: #0a0a0a; color: #f5f5f5; }
			#boot-loader span { border: 4px solid currentColor; border-radius: 16px; padding: 14px 22px; box-shadow: 6px 6px 0 currentColor; background: #ffd60a; color: #111; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-loader" data-testid="loading"><span>Loading Testing Hub...</span></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
